name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  packages: write
  contents: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

jobs:
  release-executables:
    name: Publish executable
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [win-x64, linux-x64]
        tfm: [net9.0, net10.0]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Determine version
        id: minver
        run: |
          dotnet tool install --global minver-cli --version 7.0.0
          VERSION=$(minver --tag-prefix v --default-pre-release-identifiers preview --auto-increment minor)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >-
          dotnet publish ./src/ResXporter/ResXporter.csproj
          --configuration $CONFIGURATION
          --runtime ${{ matrix.runtime }}
          --framework ${{ matrix.tfm }}
          --output ./outputs/publish/${{ matrix.tfm }}-${{ matrix.runtime }}
          --property:DebugType=None
          --property:DebugSymbols=False
          --property:PublishSingleFile=True
          --property:SelfContained=True
          --property:AssemblyName=resxporter

      - name: Archive
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: zip
          directory: ./outputs/publish/${{ matrix.tfm }}-${{ matrix.runtime }}
          filename: ../../resxporter-${{ matrix.tfm }}-${{ matrix.runtime }}-${{ steps.minver.outputs.version }}.zip

      - name: Add to release
        uses: softprops/action-gh-release@v3
        with:
          files: ./outputs/resxporter-${{ matrix.tfm }}-${{ matrix.runtime }}-${{ steps.minver.outputs.version }}.zip

  release-tool:
    name: Publish as .NET tool
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $CONFIGURATION --no-restore --warnaserror

      - name: Test
        run: dotnet test --configuration $CONFIGURATION --no-build

      - name: Pack
        run: >-
          dotnet pack ./src/ResXporter/ResXporter.csproj
          --configuration $CONFIGURATION
          --no-build
          --output ./outputs/packages
          --property:AssemblyName=resxporter

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./outputs/packages/*.nupkg
            ./outputs/packages/*.snupkg
          if-no-files-found: error

      - name: Add packages to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./outputs/packages/*.nupkg
            ./outputs/packages/*.snupkg

      - name: Login to NuGet.org
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: Kralizek

      - name: Push to NuGet.org
        run: >-
          dotnet nuget push
          "./outputs/packages/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Configure GitHub Packages source
        run: >-
          dotnet nuget add source
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --name github
          --username "${{ github.actor }}"
          --password "${{ github.token }}"
          --store-password-in-clear-text

      - name: Push to GitHub Packages
        run: >-
          dotnet nuget push
          "./outputs/packages/*.nupkg"
          --source github
          --api-key "${{ github.token }}"
          --skip-duplicate
